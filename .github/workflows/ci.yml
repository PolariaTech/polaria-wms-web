name: CI

# CI del frontend, equivalente al del api (polaria-wms-api/.github/workflows/ci.yml): construye, prueba,
# revisa con ESLint, audita las dependencias y construye la imagen de producción. Antes de esto el repo
# no ejecutaba `npm test` en ningún workflow.
#
# Qué bloquea y qué solo informa:
#   - build-and-test: BLOQUEA (compila con `next build` y corre todas las pruebas de vitest).
#   - lint: INFORMATIVO. Hoy `npm run lint` no está en verde (61 errores y 311 avisos que ya existían en
#     main), así que como obligatorio dejaría rojo cada PR. Mismo criterio que el api, que dejó su lint
#     pendiente hasta que quedara en verde. Cuando el lint esté limpio, se borra `continue-on-error`.
#   - dependency-audit: INFORMATIVO, igual que en el api.
#   - docker-image: BLOQUEA la construcción y la prueba de humo; el escaneo con Trivy es INFORMATIVO hasta
#     la primera corrida real (todavía no se ha medido qué reporta esta imagen).
# Todas las acciones de terceros van fijadas por SHA de commit, como en el api.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Lo usa la fusión programada: tras actualizar la rama de un PR con main, un push hecho con el token
  # del workflow no dispara `pull_request`, así que lanza este CI a mano sobre la rama.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # La misma versión mayor que la imagen de producción (Dockerfile: node:24).
          node-version: '24'
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      # Incluye src/ci/fusion-programada.workflow.test.ts, que necesita bash y jq (ubuntu-latest trae ambos;
      # con CI=true esa prueba falla en vez de saltarse si faltara alguno).
      - run: npm test

  # ESLint de solo lectura: `npm run lint` es `eslint` sin `--fix`.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      # INFORMATIVO por ahora: muestra el reporte pero no bloquea el PR (ver la cabecera del archivo).
      - name: ESLint (informativo)
        continue-on-error: true
        run: npm run lint

  # Escaneo de dependencias. Solo las de producción (--omit=dev): las de desarrollo no viajan en la imagen.
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci --ignore-scripts

      # INFORMATIVO, igual que en el api: muestra el reporte en rojo pero no bloquea el PR.
      - name: npm audit (producción, informativo - reporta severidad alta o crítica)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Construye la imagen de producción (ARM64, como en AWS) y la arranca. No la sube a ningún registro.
  docker-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Las NEXT_PUBLIC_* se escriben dentro de la imagen al construirla. Aquí van valores de relleno: esta
      # imagen solo se prueba, no se despliega (el despliegue usa las variables reales en deploy.yml).
      - name: Build linux/arm64
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          push: false
          tags: polaria-wms-web:ci
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.example.invalid
            NEXT_PUBLIC_SUPABASE_URL=https://example.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=test-anon-key
            NEXT_PUBLIC_APP_URL=http://localhost:3001
            NEXT_PUBLIC_MATEO_URL=https://chatbot-mateo.vercel.app
            NEXT_PUBLIC_MATEO_WIDGET_SCRIPT_URL=/assets/mateo-widget.js
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prueba de humo (GET /, usuario no root, tamaño)
        run: bash scripts/docker-smoke.sh polaria-wms-web:ci

      # Escaneo de la imagen. ignore-unfixed: solo cuenta lo que ya tiene una versión corregida.
      # INFORMATIVO hasta la primera corrida real: cuando se sepa qué reporta, se quita `continue-on-error`
      # para que falle con las CRÍTICAS con corrección, como en el api.
      - name: Escaneo de la imagen con Trivy (informativo)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: polaria-wms-web:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
