name: e2e-stack

# Score-10 P1: stack multi-repo bajo demanda (label o dispatch).
# Postgres + humo mínimo api/web. Mateo opcional si el secreto/checkout está disponible.

on:
  workflow_dispatch:
  pull_request:
    types: [labeled, synchronize, opened, reopened]

permissions:
  contents: read

concurrency:
  group: e2e-stack-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'e2e-stack')
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - name: Checkout polaria-wms-web
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout polaria-wms-api
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PolariaTech/polaria-wms-api
          path: polaria-wms-api
          persist-credentials: false

      - name: Checkout mateo-ia-api
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: PolariaTech/mateo-ia-api
          path: mateo-ia-api
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            polaria-wms-api/package-lock.json

      - name: Humo Postgres
        run: |
          psql "$DATABASE_URL" -c "SELECT 1 AS ok;"

      - name: npm ci api + test unit (sin e2e largo)
        working-directory: polaria-wms-api
        run: |
          npm ci
          npm test -- --testPathPattern=mateo-ai-utils-sync --passWithNoTests
        env:
          MATEO_IA_API_SYNC_ROOT: ${{ github.workspace }}/mateo-ia-api
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_ANON_KEY: test-anon-key
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key

      - name: npm ci web + arquitectura SSOT
        run: |
          npm ci --ignore-scripts
          npx vitest run src/lib/architecture/ordenes-utils-ssot.architecture.test.ts src/lib/architecture/wms-channels.test.ts
